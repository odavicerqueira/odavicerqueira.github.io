<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfólio de Davi Cerqueira - Estudante de Análise e Desenvolvimento de Sistemas" />
  <title>Davi Cerqueira</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <section id="hero">
    <div class=hero-container>
      <img src="assets/perfil.png" alt="Minha Foto de Perfil" />
    </div>
    <div class="terminal">
      <div class="bar">
        <div class="bar-icons">
          <span class="close">−</span>
          <span class="min">X</span>
        </div>
      </div>
      <div class="terminal-body">
        <h1 class="typing-name">Davi Cerqueira</h1>
        <h2 class="typing-sub">Estudante de Análise de Sistemas</h2>
      </div>
    </div>
  </section>
  <section class="tab-wrapper">
    <div class="tab">
      <button class="tablinks" onclick="tabContent(event, 'Sobre')">Sobre</button>
      <button class="tablinks" onclick="tabContent(event, 'Projetos')">Projetos</button>
      <button class="tablinks" onclick="tabContent(event, 'Contato')">Contato</button>
    </div>
    <div id="Sobre" class="tabcontent">
      <p>Bem-vindo ao meu portfólio! Aqui compartilho meus projetos pessoais na área de tecnologia.</p>
    </div>
    <div id="Projetos" class="tabcontent">
      <p>Em breve!</p>
    </div>
    <div id="Contato" class="tabcontent">
      <div class="contact-links">
        <a href="assets/Currículo-Davi-Cerqueira.pdf" download class="btn-contact">
          <img src="assets/pdf-img.png" alt="img" />
          <span>Currículo em PDF</span>
        </a>
        <a href="mailto:odavic3@outlook.com" class="btn-contact">
          <img src="assets/email.png" alt="Email" />
          <span>E-mail</span>
        </a>
        <a href="https://github.com/odavicerqueira" target="_blank" rel="noopener noreferrer" class="btn-contact">
          <img src="assets/github.png" alt="GitHub" />
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </section>
  <footer>
    <p>&copy; Davi Cerqueira. All rights reserved.</p>
  </footer>
</body>

</html>
